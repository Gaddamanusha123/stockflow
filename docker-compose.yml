version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: stockflow_postgres
    restart: always
    environment:
      POSTGRES_DB: stockflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockflow_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: docker-production-stockflow-secret-key-987654
      DEBUG: "False"
      ALLOWED_HOSTS: "backend,localhost,127.0.0.1"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: stockflow_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword123
      DB_HOST: db
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockflow_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:

